# ============================================================
# 开发环境配置模板（example）
# 使用方式：复制本文件为 application-dev.yml 并填入真实值
# 注意：application-dev.yml 已被 .gitignore 忽略，不会提交到仓库
#
# 数据源已在 application.yml 中配置（账号密码通过 DB_USERNAME / DB_PASSWORD 环境变量覆盖）
# 本文件主要用于 Redis / RabbitMQ 等中间件连接信息（阶段5 接入）
# ============================================================

spring:
  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# ---------- MyBatis-Plus（开发环境开启 SQL 日志） ----------
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
